<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Offers OSS">
  <defs>
    <linearGradient id="g" x1="80" y1="430" x2="430" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fb8ff"/><stop offset=".55" stop-color="#f2a77a"/><stop offset="1" stop-color="#e2475a"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#2a1c1e"/><stop offset="1" stop-color="#0d0809"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="115" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="3"/>
  <g filter="url(#glow)" fill="none" stroke="url(#g)" stroke-linecap="round" stroke-linejoin="round">
    <!-- open ring: the O, broken at top-right -->
    <path d="M330 140 A140 140 0 1 0 392 236" stroke-width="44"/>
    <!-- the offer breaking out -->
    <path d="M232 284 L388 128" stroke-width="40"/>
    <path d="M300 122 H394 V216" stroke-width="40"/>
  </g>
  <!-- spark -->
  <circle cx="420" cy="96" r="13" fill="#ffe7d6"/>
  <circle cx="420" cy="96" r="30" fill="#f2a77a" opacity=".25"/>
</svg>
